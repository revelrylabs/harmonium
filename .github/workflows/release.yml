name: Release

# Pushes to main only open or update the "Version Packages" PR from pending
# changesets. Publishing to npm never happens automatically: run this workflow
# manually (Actions → Release → Run workflow) after merging that PR.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag. Use `next` for prereleases; `latest` only for stable 9.x.
        type: choice
        options: [next, latest]
        default: next

concurrency: release

jobs:
  version:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v1
        with:
          version: pnpm run version-packages
          title: Version Packages
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: node scripts/check-dist-tag.mjs packages/harmonium/package.json "${{ inputs.tag }}"
      # `changeset publish` refuses a custom dist-tag in pre mode, so publish
      # with pnpm directly. Skips if this version is already on npm.
      - name: Publish to npm
        working-directory: packages/harmonium
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "harmonium@$version" version >/dev/null 2>&1; then
            echo "harmonium@$version is already published"
          else
            pnpm publish --tag "${{ inputs.tag }}" --access public --provenance --no-git-checks
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Tag the release
        run: |
          tag="harmonium@$(node -p "require('./packages/harmonium/package.json').version")"
          git tag "$tag" && git push origin "$tag"
