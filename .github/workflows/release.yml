name: Release v8

# Harmonium 8.x is in maintenance (bug and security fixes only); new work
# happens on main as v9. Releases are manual: Actions → Release v8 → Run
# workflow on the 8.x branch. scripts/check-dist-tag.js picks the npm
# dist-tag so an 8.x patch never takes `latest` away from v9.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (maintenance releases are patch-only unless agreed otherwise)
        type: choice
        options: [patch, minor]
        default: patch

concurrency: release-v8

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish:
    needs: [test]
    if: github.ref == 'refs/heads/8.x'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        registry-url: https://registry.npmjs.org
    - run: npm ci
    - run: npm run build
    - run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        npm version ${{ inputs.bump }} -m "chore(release): %s [skip ci]"
    - id: tag
      run: echo "tag=$(node scripts/check-dist-tag.js)" >> "$GITHUB_OUTPUT"
    - run: npm publish --tag "${{ steps.tag.outputs.tag }}"
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        NPM_CONFIG_PROVENANCE: true
    - run: git push --follow-tags origin HEAD:8.x
