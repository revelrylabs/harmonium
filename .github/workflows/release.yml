name: Release

# Pushes to main only open or update the "Version Packages" PR from pending
# changesets. Publishing to npm never happens automatically: run this workflow
# manually (Actions → Release → Run workflow) after merging that PR.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag. Use `next` for prereleases; `latest` only for stable 9.x.
        type: choice
        options: [next, latest]
        default: next

jobs:
  version:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Scoped per job so a publish waiting for approval never blocks this.
    concurrency: release-version
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v2
        with:
          version-script: pnpm run version-packages
          pr-title: Version Packages
          commit-message: 'chore: version packages'
          github-token: ${{ secrets.GITHUB_TOKEN }}

  test:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/test.yml

  publish:
    needs: [test]
    runs-on: ubuntu-latest
    concurrency: release-publish
    # Publishing uses npm trusted publishing (OIDC): npm accepts this job
    # because it runs from release.yml in the `npm` environment, which
    # requires a maintainer's approval. Provenance is generated automatically.
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # Fail fast on a wrong dist-tag; this only reads package.json.
      - run: node scripts/check-dist-tag.mjs packages/harmonium/package.json "${{ inputs.tag }}"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # No dependency cache in the job that can publish.
          package-manager-cache: false
      # Trusted publishing needs npm 11.5.1 or newer; pinned because this job
      # holds publish rights.
      - run: npm install -g npm@11.20.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # `changeset publish` refuses a custom dist-tag in pre mode, so publish
      # with npm directly. Skips a version that is already on npm, and fails
      # on any registry error other than "not found".
      - name: Publish to npm
        working-directory: packages/harmonium
        run: |
          version=$(node -p "require('./package.json').version")
          if out=$(npm view "harmonium@$version" version 2>&1); then status=0; else status=$?; fi
          if [ "$status" -eq 0 ] && [ "$out" = "$version" ]; then
            echo "harmonium@$version is already published"
          elif [ "$status" -eq 0 ] || grep -q E404 <<<"$out"; then
            npm publish --tag "${{ inputs.tag }}" --access public
          else
            echo "$out" >&2
            exit 1
          fi
      - name: Tag the release
        run: |
          tag="harmonium@$(node -p "require('./packages/harmonium/package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists"
          else
            git tag "$tag" && git push origin "$tag"
          fi
