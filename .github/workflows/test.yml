name: Test

on:
  push:
    branches: [main, 8.x]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Fails when a bundle-size budget in packages/harmonium/scripts/check-size.ts
      # is exceeded; the table also lands in the job summary.
      - run: pnpm size
      - run: pnpm test
      - run: pnpm lint
